{% extends "base.html" %}
{% block title %}RegAdmin{% endblock %}
{% block content %}
<section class="hero">
  <p class="brand-mark">Reg<span>Admin</span></p>
  <h1>Registration for your organization.</h1>
  <p>Register your organization to subscribe. An admin reviews the request before your tenant is created.</p>
  <div class="hero-actions">
    <a class="btn btn-primary" href="{{ url_for('auth.register') }}">Register your organization</a>
    <a class="btn btn-ghost" href="{{ url_for('auth.login') }}">Sign in</a>
  </div>
</section>
{% endblock %}
