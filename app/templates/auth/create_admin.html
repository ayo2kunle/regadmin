{% extends "base.html" %}
{% block title %}Create admin — RegAdmin{% endblock %}
{% block content %}
<div class="page-header">
  <div>
    <h1>Create admin</h1>
    <p>Add another staff account. Only signed-in admins can do this.</p>
  </div>
</div>

<section class="panel" style="max-width: 520px;">
  <form method="post" class="form-grid">
    <label>
      Username
      <input type="text" name="username" required minlength="3" autocomplete="off" autofocus>
    </label>
    <label>
      Password
      <input type="password" name="password" required minlength="6" autocomplete="new-password">
    </label>
    <label>
      Confirm password
      <input type="password" name="confirm_password" required minlength="6" autocomplete="new-password">
    </label>
    <div class="form-actions">
      <button class="btn btn-primary" type="submit">Create admin</button>
      <a class="btn btn-ghost" href="{{ url_for('auth.list_admins') }}">Cancel</a>
    </div>
  </form>
</section>
{% endblock %}
