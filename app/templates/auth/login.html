{% extends "base.html" %}
{% block title %}Sign in — RegAdmin{% endblock %}
{% block content %}
<div class="auth-wrap panel">
  <h1>Sign in</h1>
  <p>Use the email from your approved organization, or your admin username.</p>
  <form method="post" class="form-grid">
    <label>
      Email
      <input type="text" name="login" required autocomplete="username" autofocus>
    </label>
    <label>
      Password
      <input type="password" name="password" required autocomplete="current-password">
    </label>
    <div class="form-actions">
      <button class="btn btn-primary" type="submit">Sign in</button>
      <a class="btn btn-ghost" href="{{ url_for('auth.register') }}">Register</a>
    </div>
  </form>
</div>
{% endblock %}
