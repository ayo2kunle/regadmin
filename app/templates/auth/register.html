{% extends "base.html" %}
{% block title %}Create staff account — RegAdmin{% endblock %}
{% block content %}
<div class="auth-wrap panel">
  <h1>Create staff account</h1>
  <p>Staff accounts can create events and register attendees.</p>
  <form method="post" class="form-grid">
    <label>
      Username
      <input type="text" name="username" required minlength="3" autocomplete="username" autofocus>
    </label>
    <label>
      Password
      <input type="password" name="password" required minlength="6" autocomplete="new-password">
    </label>
    <label>
      Confirm password
      <input type="password" name="confirm_password" required minlength="6" autocomplete="new-password">
    </label>
    <div class="form-actions">
      <button class="btn btn-primary" type="submit">Create account</button>
      <a class="btn btn-ghost" href="{{ url_for('auth.login') }}">Back to sign in</a>
    </div>
  </form>
</div>
{% endblock %}
